# AI stack: LiteLLM Proxy + PostgreSQL (+ Open WebUI ve fázi 4)
# Umístění na serveru: /opt/ai-stack/docker-compose.yml
# Tajemství se načítají z /opt/ai-stack/.env (vzor: .env.example).

name: ai-stack

# Společné nastavení logů: rotace, aby logy kontejnerů nezaplnily disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Pinovaná verze – nikdy "latest". Upgrade minor verze (16.x) je bezpečný,
    # upgrade major verze (16 -> 17) vyžaduje dump/restore.
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?chybí v .env}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Žádné "ports:" – databáze je dostupná jen z interní sítě ai-net.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ai-net]
    logging: *default-logging

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.6
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?chybí v .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?chybí v .env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:?chybí v .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?chybí v .env}
      # Nenačítat .env uvnitř kontejneru – proměnné dodává compose.
      LITELLM_MODE: PRODUCTION
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      # Vystaveno do lab sítě (API /v1 a Admin UI /ui).
      # Pro přístup jen z hostu: "127.0.0.1:4000:4000"
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Image neobsahuje curl/wget, proto Python.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [ai-net]
    logging: *default-logging

volumes:
  pgdata:

networks:
  ai-net:
