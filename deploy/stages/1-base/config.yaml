# LiteLLM Proxy – STAGE 1-base: part 1 – Open WebUI -> LiteLLM -> OpenRouter, PostgreSQL
# Location on the server: /opt/ai-stack/config.yaml
# Docs: https://docs.litellm.ai/docs/proxy/configs
#
# Values of the form "os.environ/NAME" are read by LiteLLM from the container's
# environment variable, which docker-compose.yml passes in from the .env file.
# This file therefore contains no secrets and is safe to keep in version control.

model_list:
  # model_name = public model name that clients see (Open WebUI, curl).
  # The provider behind it can be swapped at any time without changing clients.
  - model_name: nemotron-3-ultra
    litellm_params:
      # prefix "openrouter/" = provider, the rest = model ID on OpenRouter
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      description: "NVIDIA Nemotron 3 Ultra via OpenRouter (free tier)"

litellm_settings:
  # Maximum time to wait for the provider's response (s). The default is very high.
  request_timeout: 600

general_settings:
  # Proxy admin key. Virtual keys do not work without it (and without the DB).
  master_key: os.environ/LITELLM_MASTER_KEY
  # PostgreSQL connection (virtual keys, users, spend tracking, logs).
  database_url: os.environ/DATABASE_URL
  # X-Forwarded-For is NOT trusted by default (use_x_forwarded_for is off).
  # Behind Caddy (part 2, module F0) LiteLLM therefore sees Caddy's container IP
  # instead of the real client IP. Add "use_x_forwarded_for: true" only once
  # port 4000 is no longer published directly – otherwise any client could
  # spoof its IP via the header (part 2, section 7.8).
